<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Example</title>
</head>
<body>
    <h1>SVG Example in HTML</h1>

    <!-- Ek simple circle -->
    <svg width="200" height="200">
        <circle cx="100" cy="100" r="50" fill="blue" stroke="black" stroke-width="3" />
    </svg>

    <!-- Ek rectangle -->
    <svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
        <rect width="150" height="75" fill="green" stroke="red" stroke-width="4" />
    </svg>

    <!-- Ek line -->
    <svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="50" x2="300" y2="50" stroke="black" stroke-width="2" />
    </svg>
</body>
</html>
