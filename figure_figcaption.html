<!-- The <figure> and <figcaption> elements in HTML are used together to mark up media content (such as images, illustrations, videos, charts, etc.) along with their descriptions.

    <figure> Element:
    The <figure> element is used to group media content along with its caption or description. It provides semantic meaning, indicating that the media is self-contained and might be referenced or displayed independently from the rest of the page content.
    
    <figcaption> Element:
    The <figcaption> element is used inside the <figure> element to provide a caption or description for the media content -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <figure>
        <img width="500" src="semantic-tags.png" alt="A beautiful sunset">
        <figcaption>A beautiful sunset over the ocean</figcaption>
      </figure>
      
</body>
</html>
